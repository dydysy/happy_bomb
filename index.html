<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>밤토리 생일 축하해</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #FFFFFF;
    --panel: #FFF7D6;
    --yellow: #FFD400;
    --yellow-deep: #F2C200;
    --ink: #221B10;
    --muted: #948C77;
    --line: #ECE7D6;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Gaegu', sans-serif;
    font-weight: 400;
  }

  h1, h2, .rounded{
    font-family: 'Gaegu', sans-serif;
    font-weight: 700;
  }

  :focus-visible{
    outline: 3px solid var(--yellow-deep);
    outline-offset: 4px;
  }

  button{ font-family: 'Gaegu', sans-serif; }

  /* ---------- PAGE FRAME ---------- */

  .viewport{
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }

  .pages-track{
    display: flex;
    flex-direction: row;
    height: 100%;
    will-change: transform;
    transition: transform 0.7s cubic-bezier(.65,0,.35,1);
  }

  .page{
    width: 100vw;
    height: 100%;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8vh 6vw;
    position: relative;
  }

  .eyebrow{
    font-size: 1rem;
    letter-spacing: 0.12em;
    color: var(--yellow-deep);
    margin-bottom: 16px;
    font-weight: 700;
  }

  /* ---------- HERO ---------- */

  .hero__photo{
    width: clamp(120px, 22vw, 180px);
    height: clamp(120px, 22vw, 180px);
    border-radius: 26px;
    border: 4px solid var(--yellow);
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 0.85rem;
    overflow: hidden;
    margin-bottom: 22px;
    transform: rotate(-3deg);
  }

  .hero__photo img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .hero__counter{
    font-size: 0.95rem;
    color: var(--ink);
    background: var(--yellow);
    border-radius: 999px;
    padding: 6px 20px;
    margin-bottom: 22px;
  }

  .hero h1{
    font-size: clamp(2.4rem, 8vw, 5rem);
    margin: 0 0 16px;
    line-height: 1.3;
  }

  .hero p.hero__sub{
    color: var(--muted);
    font-size: clamp(1.1rem, 2vw, 1.4rem);
    max-width: 30ch;
    margin: 0;
  }

  /* ---------- LETTER ---------- */

  .letter__paper{
    background: var(--panel);
    border: 3px solid var(--yellow);
    border-radius: 18px;
    padding: 6vh 7vw;
    text-align: left;
    max-width: 560px;
  }

  .letter__title{
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    margin: 0 0 22px;
  }

  .letter__text{
    font-size: clamp(1.05rem, 2vw, 1.2rem);
    white-space: pre-line;
    line-height: 1.9;
  }

  .letter__sign{
    margin-top: 30px;
    text-align: right;
    font-size: 1.1rem;
  }

  /* ---------- PHOTO LETTER (swipeable) ---------- */

  .memories-head{
    margin-bottom: 3vh;
  }

  .memories-head .sub{
    color: var(--muted);
    font-size: 1rem;
    margin: 4px 0 0;
  }

  .carousel{
    width: min(88vw, 480px);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .carousel__viewport{
    width: 100%;
    overflow: hidden;
    border-radius: 20px;
    touch-action: pan-y;
  }

  .carousel__track{
    display: flex;
    transition: transform 0.5s cubic-bezier(.65,0,.35,1);
  }

  .mem-card{
    width: 100%;
    flex-shrink: 0;
    background: var(--panel);
    border: 3px solid var(--yellow);
    border-radius: 20px;
    overflow: hidden;
  }

  .mem-card__photo{
    width: 100%;
    aspect-ratio: 4/3;
    background: #FFF3B0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 0.95rem;
    border-bottom: 3px solid var(--yellow);
    overflow: hidden;
  }

  .mem-card__photo img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .mem-card__body{
    padding: 22px 24px 26px;
    text-align: left;
  }

  .mem-card__date{
    font-size: 0.85rem;
    color: var(--muted);
    margin: 0 0 8px;
    font-style: italic;
  }

  .mem-card__text{
    font-size: 1.08rem;
    margin: 0;
    line-height: 1.75;
  }

  .carousel__controls{
    display: flex;
    align-items: center;
    gap: 22px;
    margin-top: 3vh;
  }

  .carousel__arrow{
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--yellow);
    color: var(--ink);
    border: none;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .carousel__arrow:disabled{ opacity: 0.35; cursor: default; }

  .carousel__dots{
    display: flex;
    gap: 8px;
  }

  .carousel__dots span{
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--line);
    border: 1.5px solid var(--yellow-deep);
    cursor: pointer;
  }

  .carousel__dots span.active{
    background: var(--yellow-deep);
  }

  /* ---------- WISH ---------- */

  .wish__sub{
    color: var(--muted);
    font-size: 1.05rem;
    margin: -2vh 0 4vh;
  }

  .wish__candle{
    width: 34px;
    height: 90px;
    margin: 0 auto 4vh;
    position: relative;
  }

  .wish__candle .stick{
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 58px;
    background: var(--panel);
    border: 3px solid var(--yellow-deep);
    border-radius: 4px;
  }

  .wish__candle .flame{
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%) scale(1);
    width: 16px;
    height: 28px;
    background: radial-gradient(circle at 50% 70%, #FFF3B0 0%, #FF9E00 75%);
    border: 2px solid var(--yellow-deep);
    border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
    transform-origin: bottom center;
    transition: transform 0.7s ease, opacity 0.7s ease;
    animation: flicker 1.8s ease-in-out infinite;
  }

  @keyframes flicker{
    0%, 100%{ transform: translateX(-50%) scale(1) rotate(-2deg); }
    50%{ transform: translateX(-50%) scale(1.08) rotate(2deg); }
  }

  .wish__candle.blown .flame{
    animation: none;
    transform: translateX(-50%) scale(0);
    opacity: 0;
  }

  .wish textarea{
    width: min(90vw, 460px);
    min-height: 110px;
    padding: 18px;
    background: var(--panel);
    border: 3px solid var(--yellow);
    border-radius: 14px;
    color: var(--ink);
    font-family: 'Gaegu', sans-serif;
    font-size: 1.05rem;
    resize: vertical;
    margin-bottom: 18px;
  }

  .wish textarea::placeholder{ color: var(--muted); }

  .wish .btn-row{
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .wish button.submit{
    background: var(--yellow);
    color: var(--ink);
    border: none;
    padding: 12px 30px;
    font-size: 1.05rem;
    cursor: pointer;
    border-radius: 999px;
    transition: transform 0.2s ease;
  }

  .wish button.submit:hover{ transform: scale(1.05); }

  .wish button.send{
    background: var(--ink);
    color: var(--yellow);
    border: none;
    padding: 12px 26px;
    font-size: 1.02rem;
    cursor: pointer;
    border-radius: 999px;
    display: none;
  }

  .wish button.send.show{ display: inline-block; }

  .wish__confirm{
    margin-top: 22px;
    color: var(--ink);
    font-size: 1.1rem;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .wish__confirm.show{
    opacity: 1;
    transform: translateY(0);
  }

  /* ---------- FINAL ---------- */

  .final h2{
    font-size: clamp(2.2rem, 6vw, 3.6rem);
    margin: 0 0 26px;
  }

  .final__message{
    max-width: 40ch;
    margin: 0 auto;
    color: var(--muted);
    font-size: 1.15rem;
    white-space: pre-line;
  }

  .final__rule{
    width: 60px;
    height: 4px;
    background: var(--yellow);
    border-radius: 3px;
    margin: 26px auto;
  }

  /* ---------- OUTER NAV ---------- */

  .nav-dots{
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 20;
  }

  .nav-dots button{
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: transparent;
    border: 2px solid var(--yellow-deep);
    cursor: pointer;
    padding: 0;
  }

  .nav-dots button.active{
    background: var(--yellow-deep);
  }

  .nav-side{
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    z-index: 20;
  }

  .nav-side.left{ left: clamp(10px, 3vw, 30px); }
  .nav-side.right{ right: clamp(10px, 3vw, 30px); }

  .nav-side button{
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--yellow);
    color: var(--ink);
    border: none;
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .nav-side button:disabled{
    opacity: 0.25;
    cursor: default;
  }

  @media (prefers-reduced-motion: reduce){
    .pages-track, .carousel__track, .wish__candle .flame, .wish__confirm{ transition: none !important; animation: none !important; }
  }

  @media (max-width: 560px){
    .nav-side button{ width: 38px; height: 38px; font-size: 1.1rem; }
  }
</style>
</head>
<body>


<div class="viewport" id="viewport">
  <div class="pages-track" id="pagesTrack">

    <!-- 1. 시작 -->
    <section class="page">
      <div class="hero__photo" id="heroPhoto"></div>
      <div class="eyebrow">Happy Birthday</div>
      <div class="hero__counter" id="dayCounter"></div>
      <h1 id="heroTitle">밤토리 생일 축하해</h1>
      <p class="hero__sub" id="heroSub">I Love You ♡</p>
    </section>

    <!-- 2. 편지 -->
    <section class="page">
      <div class="eyebrow">A Letter for U</div>
      <div class="letter__paper">
        <p class="letter__title" id="letterTitle">밤토리에게</p>
        <p class="letter__text" id="letterText">우히히히힣</p>
        <p class="letter__sign" id="letterSign">— 말랑이가</p>
      </div>
    </section>

    <!-- 3. 사진과 함께 이어지는 편지 (스와이프) -->
    <section class="page">
      <div class="memories-head">
        <div class="eyebrow">Dear Bamtori</div>
        <p class="sub">사진 넘기면서 읽어줘</p>
      </div>
      <div class="carousel">
        <div class="carousel__viewport">
          <div class="carousel__track" id="carouselTrack"></div>
        </div>
        <div class="carousel__controls">
          <button class="carousel__arrow" id="memPrev" aria-label="이전 사진">‹</button>
          <div class="carousel__dots" id="memDots"></div>
          <button class="carousel__arrow" id="memNext" aria-label="다음 사진">›</button>
        </div>
      </div>
    </section>

    <!-- 4. 소원 -->
    <section class="page wish">
      <div class="eyebrow">Make A Wish</div>
      <h2 style="font-size: clamp(1.8rem, 5vw, 2.6rem); margin:0 0 8px;">소원을 말해봐</h2>
      <p class="wish__sub" id="wishSub">오케이 소원권 다시 기회 줄테니 신중하게 쓰시오!</p>
      <!-- <div class="wish__candle" id="candle">
        <div class="stick"></div>
        <div class="flame"></div>
      </div> -->
      <textarea id="wishInput" placeholder="소원을 적으시오!"></textarea>
      <div class="btn-row">
        <button class="submit" id="wishButton">소원 빌기</button>
        <button class="send" id="sendButton">나한테 보내기 (직접 보내기)</button>
      </div>
      <p class="wish__confirm" id="wishConfirm">알겠다 밤토리! 기대해라!</p>
    </section>

    <!-- 5. 마무리 -->
    <section class="page final">
      <div class="eyebrow">To Bamtori</div>
      <div class="final__rule"></div>
      <h2 id="finalTitle">생일 축하해</h2>
      <p class="final__message" id="finalMessage">마지막까지 힘내서 미국 교육 잘 수료하고 곧 봐용! 기다릴게~</p>
    </section>

  </div>
</div>

<div class="nav-side left"><button id="pagePrev" aria-label="이전 페이지">‹</button></div>
<div class="nav-side right"><button id="pageNext" aria-label="다음 페이지">›</button></div>
<div class="nav-dots" id="navDots"></div>


<script>
  /* ================================================================
     Contents
     ================================================================ */

  const BIRTHDAY  = "1995-08-10";

  const HERO_IMAGE = "images/image-1.jpg";
  const HERO_TITLE = "밤토리야! 생일 축하해";
  const HERO_SUB = "말랑이가 준비했어♡";

  const LETTER_TITLE = "밤토리에게";
  const LETTER_TEXT = "안녕 내 사랑!\n오늘 생일 진심으로 축하해!\n미국에서 보내는 생일은 더 특별하니까\n행복하고 알찬 하루 보내길 바라\n항상 내가 옆에 있을게\n사랑해♡";
  const LETTER_SIGN = "— 수연이가";

  const MEMORIES = [
    { date: "오빠가 마음에 든다는 사진ㅎㅎ", text: "내 홈그라운드 액트로 오빠 데려온 날ㅋㅎ\n이뻤다 우리" , image:  "images/image-1.jpg" },
    { date: "It's only for you", text: "나는 바다, 당신은 산\n바다 만큼 당신을 좋아해!", image: "images/image-2.jpg" },
    { date: "100日", text: "빨리 한국 와! 1주년도 제대로 축하할래옹~\n그리고 항상 감동을 줘서 고마워", image: "images/image-3.png" },
    { date: "장꾸", text: "오빠랑 노는 게 제일 재밌어\n(당신이랑 딥토크도 재밌어!)", image: "images/image-4.jpg" },
    { date: "내가 좋아하는, 행복해보이는 당신 사진", text: "오빠랑 교회 같이 가는 것도 너무 즐거워!\n우리가 서로 더 사랑하고, 행복을 나누는 사람들이 되길\n기도할게", image: "images/image-5.jpg" },
    { date: "Love you", text: "오빠 옆에 있을 때 가장 나다워 지는 것 같아\n나를 더 사랑하게 되고, 더 좋은 사람이 되고 싶어져", image: "images/image-6.jpg" },
    { date: "Love yourself", text: "오빠도 내 곁에서 가장 오빠다울 수 있으면 좋겠어\n진심이야", image: "images/image-7.jpg" },
    { date: "Happy Birthday My Love ♥", text: "지금처럼 행복하게 살자!\n앞으로 지치고 힘든 일들도 많겠지만,\n서로를 의지하고 기도해주면서 예쁘게 사랑하자구~\n생일을 진심으로 축하해 밤토리야!", image: "images/image-8.png" },
  ];

  const WISH_SUB = "오케이 소원권 다시 기회 줄테니 신중하게 쓰시오!";

  // 소원을 자동으로 회원님 메일함에 보내줄 Formspree 주소
  const FORMSPREE_ENDPOINT = "https://formspree.io/f/mqpzpkkl";

  const FINAL_TITLE = "밤토리! 생일 축하해";
  const FINAL_MESSAGE = "마지막까지 힘내서 미국 교육 잘 수료하고 곧 봐용! 기다릴게~";

  /* ================================================================
     여기부터는 수정하지 않아도 됩니다.
     ================================================================ */

  document.getElementById("heroTitle").textContent = HERO_TITLE;
  document.getElementById("heroSub").textContent = HERO_SUB;
  document.getElementById("letterTitle").textContent = LETTER_TITLE;
  document.getElementById("letterText").textContent = LETTER_TEXT;
  document.getElementById("letterSign").textContent = LETTER_SIGN;
  document.getElementById("wishSub").textContent = WISH_SUB;
  document.getElementById("finalTitle").textContent = FINAL_TITLE;
  document.getElementById("finalMessage").textContent = FINAL_MESSAGE;

  // 첫 페이지 사진
  (function renderHeroPhoto(){
    const holder = document.getElementById("heroPhoto");
    if (!HERO_IMAGE) { holder.textContent = "사진을 넣어주세요"; return; }
    const img = document.createElement("img");
    img.src = HERO_IMAGE;
    img.alt = "우리 사진";
    img.onerror = () => { holder.textContent = "사진을 넣어주세요"; img.remove(); };
    holder.appendChild(img);
  })();

  (function renderCounter(){
    const birth = new Date(BIRTHDAY);
    const now = new Date();
    let age = now.getFullYear() - birth.getFullYear();
    const hadBirthdayThisYear = (now.getMonth() > birth.getMonth()) ||
      (now.getMonth() === birth.getMonth() && now.getDate() >= birth.getDate());
    if (!hadBirthdayThisYear) age -= 1;
    if (!isNaN(age)){
      document.getElementById("dayCounter").textContent = `${birth.getMonth() + 1}월 ${birth.getDate()}일 · 오늘 ${age}살!`;
    }
  })();

  /* ---------------- 사진 편지 캐러셀 ---------------- */

  const carouselTrack = document.getElementById("carouselTrack");
  const memDotsWrap = document.getElementById("memDots");
  let memIndex = 0;

  MEMORIES.forEach((m, i) => {
    const card = document.createElement("div");
    card.className = "mem-card";
    card.innerHTML = `
      <div class="mem-card__photo">
        ${m.image ? `<img src="${m.image}" alt="사진 ${i + 1}" onerror="this.parentElement.textContent='사진을 이 자리에 넣어주세요'; this.remove();">` : "사진을 이 자리에 넣어주세요"}
      </div>
      <div class="mem-card__body">
        <p class="mem-card__date">${m.date}</p>
        <!-- <p class="mem-card__text">${m.text}</p> -->
        <p class="mem-card__text">${m.text.replaceAll('\n', '<br>')}</p>
      </div>
    `;
    carouselTrack.appendChild(card);

    const dot = document.createElement("span");
    dot.addEventListener("click", () => setMemIndex(i));
    memDotsWrap.appendChild(dot);
  });

  function setMemIndex(i){
    memIndex = Math.max(0, Math.min(MEMORIES.length - 1, i));
    carouselTrack.style.transform = `translateX(-${memIndex * 100}%)`;
    [...memDotsWrap.children].forEach((d, idx) => d.classList.toggle("active", idx === memIndex));
    document.getElementById("memPrev").disabled = memIndex === 0;
    document.getElementById("memNext").disabled = memIndex === MEMORIES.length - 1;
  }
  setMemIndex(0);

  document.getElementById("memPrev").addEventListener("click", () => setMemIndex(memIndex - 1));
  document.getElementById("memNext").addEventListener("click", () => setMemIndex(memIndex + 1));

  /* ---------------- 소원 ---------------- */

  const candle = document.getElementById("candle");
  const wishInput = document.getElementById("wishInput");
  const wishButton = document.getElementById("wishButton");
  const sendButton = document.getElementById("sendButton");
  const wishConfirm = document.getElementById("wishConfirm");

  try{
    const savedWish = localStorage.getItem("bamtori_wish");
    const alreadySent = localStorage.getItem("bamtori_wish_sent") === "1";
    if (savedWish){
      wishInput.value = savedWish;
      candle.classList.add("blown");
      wishConfirm.classList.add("show");
      wishConfirm.textContent = alreadySent
        ? "알겠다 밤토리! 기대해라!"
        : "소원 저 장";
      if (!alreadySent) sendButton.classList.add("show");
    }
  }catch(e){}

async function autoSendWish(value){
  if (!FORMSPREE_ENDPOINT) return false;
  try{
    // Formspree 전송 시 JSON 대신 FormData를 사용하면 스팸 차단을 피할 수 있습니다.
    const formData = new FormData();
    formData.append("소원", value);

    const res = await fetch(FORMSPREE_ENDPOINT, {
      method: "POST",
      body: formData,
      headers: { "Accept": "application/json" }
    });
    
    // 만약 전송 실패 시 개발자 도구 콘솔에 에러 코드를 출력합니다.
    if (!res.ok) {
      console.error("Formspree 응답 에러 상태 코드:", res.status);
    }
    
    return res.ok;
  }catch(e){
    console.error("네트워크 전송 에러:", e);
    return false;
  }
}

  wishButton.addEventListener("click", async () => {
    const value = wishInput.value.trim();
    if (!value) { wishInput.focus(); return; }

    try{ localStorage.setItem("bamtori_wish", value); }catch(e){}
    candle.classList.add("blown");
    wishConfirm.classList.add("show");
    wishConfirm.textContent = "보내는 중...";
    wishButton.disabled = true;

    const sent = await autoSendWish(value);
    wishButton.disabled = false;

    if (sent){
      try{ localStorage.setItem("bamtori_wish_sent", "1"); }catch(e){}
      wishConfirm.textContent = "알겠다 밤토리! 기대해라!";
      sendButton.classList.remove("show");
    } else {
      wishConfirm.textContent = "소원 저 장";
      sendButton.classList.add("show");
    }
  });

  sendButton.addEventListener("click", async () => {
    const value = wishInput.value.trim();
    if (!value) return;

    const sent = await autoSendWish(value);
    if (sent){
      try{ localStorage.setItem("bamtori_wish_sent", "1"); }catch(e){}
      wishConfirm.textContent = "알겠다 밤토리! 기대해라!";
      sendButton.classList.remove("show");
      return;
    }

    const shareText = `밤토리의 생일 소원: ${value}`;
    if (navigator.share){
      try{ await navigator.share({ text: shareText }); return; }catch(e){ /* 사용자가 취소했을 수 있음 */ }
    }
    try{
      await navigator.clipboard.writeText(shareText);
      sendButton.textContent = "복사됐어! 카톡에 붙여넣어줘";
      setTimeout(() => { sendButton.textContent = "나한테 보내기 (직접 보내기)"; }, 2600);
    }catch(e){
      alert(shareText);
    }
  });

  /* ---------------- 페이지 넘김 (좌우 슬라이드) ---------------- */

  const pagesTrack = document.getElementById("pagesTrack");
  const pages = document.querySelectorAll(".page");
  const navDotsWrap = document.getElementById("navDots");
  const pagePrevBtn = document.getElementById("pagePrev");
  const pageNextBtn = document.getElementById("pageNext");
  let pageIndex = 0;
  let animating = false;
  const MEMORIES_PAGE_INDEX = 2;

  pages.forEach((_, i) => {
    const dot = document.createElement("button");
    dot.setAttribute("aria-label", `${i + 1}번째 페이지로 이동`);
    dot.addEventListener("click", () => goToPage(i));
    navDotsWrap.appendChild(dot);
  });

  function updateNav(){
    [...navDotsWrap.children].forEach((d, idx) => d.classList.toggle("active", idx === pageIndex));
    pagePrevBtn.disabled = pageIndex === 0;
    pageNextBtn.disabled = pageIndex === pages.length - 1;
  }

  function goToPage(i){
    if (animating) return;
    const clamped = Math.max(0, Math.min(pages.length - 1, i));
    if (clamped === pageIndex) return;
    pageIndex = clamped;
    animating = true;
    pagesTrack.style.transform = `translateX(-${pageIndex * window.innerWidth}px)`;
    updateNav();
    setTimeout(() => { animating = false; }, 720);
  }

  window.addEventListener("resize", () => {
    pagesTrack.style.transition = "none";
    pagesTrack.style.transform = `translateX(-${pageIndex * window.innerWidth}px)`;
    requestAnimationFrame(() => { pagesTrack.style.transition = ""; });
  });

  pagePrevBtn.addEventListener("click", () => goToPage(pageIndex - 1));
  pageNextBtn.addEventListener("click", () => goToPage(pageIndex + 1));
  updateNav();

  // 키보드: 사진편지 페이지에서는 좌우가 카드 넘기기 우선
  window.addEventListener("keydown", (e) => {
    const tag = document.activeElement.tagName;
    if (tag === "TEXTAREA" || tag === "INPUT") return;

    if (pageIndex === MEMORIES_PAGE_INDEX && (e.key === "ArrowLeft" || e.key === "ArrowRight")){
      e.preventDefault();
      setMemIndex(memIndex + (e.key === "ArrowRight" ? 1 : -1));
      return;
    }
    if (e.key === "ArrowRight"){
      e.preventDefault();
      goToPage(pageIndex + 1);
    } else if (e.key === "ArrowLeft"){
      e.preventDefault();
      goToPage(pageIndex - 1);
    } else if (e.key === "ArrowDown"){
      e.preventDefault();
      goToPage(pageIndex + 1);
    } else if (e.key === "ArrowUp"){
      e.preventDefault();
      goToPage(pageIndex - 1);
    }
  });

  // 휠 — 카드 영역 위에서는 outer 페이지 넘김을 하지 않음
  let wheelLock = false;
  document.getElementById("viewport").addEventListener("wheel", (e) => {
    if (e.target.closest(".carousel")) return;
    if (wheelLock) { e.preventDefault(); return; }
    const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (Math.abs(delta) < 20) return;
    e.preventDefault();
    wheelLock = true;
    setTimeout(() => { wheelLock = false; }, 720);
    if (delta > 0) goToPage(pageIndex + 1);
    else goToPage(pageIndex - 1);
  }, { passive: false });

  // 터치 스와이프 — 카드 안쪽은 캐러셀이, 바깥쪽은 outer 페이지 넘김이 처리
  let touchStartX = 0, touchStartY = 0, touchInsideCarousel = false;
  document.getElementById("viewport").addEventListener("touchstart", (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchInsideCarousel = !!e.target.closest(".carousel");
  }, { passive: true });

  document.getElementById("viewport").addEventListener("touchend", (e) => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;

    if (touchInsideCarousel && pageIndex === MEMORIES_PAGE_INDEX){
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){
        setMemIndex(memIndex + (dx < 0 ? 1 : -1));
      }
      return;
    }
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)){
      if (dx < 0) goToPage(pageIndex + 1);
      else goToPage(pageIndex - 1);
    }
  }, { passive: true });
</script>
